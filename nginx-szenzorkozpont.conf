# SzenzorKozpont — nginx template. Do NOT copy verbatim!
#
# Placeholders (replace all with your own values):
#   <DOMAIN>  domain, e.g. sensor.example.hu
#   <APP>     webapp/site name, e.g. my_webapp__1 or szenzorkozpont
#   <ALIAS>   sub-URL, e.g. /szkp (only needed for alias installs)
#   <PHPFPM>  PHP-FPM socket, e.g. unix:/var/run/php/php8.3-fpm.sock
#             (YunoHost my_webapp: unix:/var/run/php/php8.4-fpm-<APP>.sock)
#
# Go-live for both variants: nginx -t && systemctl reload nginx
#
# ============================================================ A) Debian+nginx
# Files: srv/ CONTENTS -> /var/www/<APP>/ (this becomes the document root).
# A2 for sub-URL: alias instead of root + the PHP block pattern below
# (see variant B PHP block: build SCRIPT_FILENAME from $request_filename,
# because the alias-unaware PHP block would yield a wrong filename).

server {
    listen 443 ssl;
    server_name <DOMAIN>;
    # TLS: certbot or own certificate (certbot --nginx -d <DOMAIN>).

    root /var/www/<APP>;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        fastcgi_pass <PHPFPM>;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    }

    location ^~ /data/ { deny all; }
    location ^~ /src/ { deny all; }
    location = /config.php { deny all; }
    location = /config.example.php { deny all; }
    location = /cron.php { deny all; }
    location ~ ^/.*\.(md|conf|gitignore)$ { deny all; }
}

# ============================================================ B) YunoHost+nginx
# Files: srv/ CONTENTS -> the app www/ dir (SFTP).
# Include this file from <APP>.conf INSIDE the "location <ALIAS>/ {" block:
#   place at: /etc/nginx/conf.d/<DOMAIN>.d/<APP>.d/szenzorkozpont.conf
# PLUS 1 line change in <APP>.conf:
#   location <ALIAS>/ {  ->  location ^~ <ALIAS>/ {
# (^~ keeps the alias-unaware server-level PHP block from grabbing the request;
#  the nested PHP block below runs instead, yielding a good filename with alias)
#
# REQUIREMENT: in YunoHost app access the app must be public ("visitors"),
# otherwise SSOWAT sends API calls to login too.

location ~ [^/]\.php(/|$) {
    fastcgi_split_path_info ^(.+?\.php)(/.*)$;
    fastcgi_pass <PHPFPM>;
    fastcgi_index index.php;
    include fastcgi_params;
    fastcgi_param REMOTE_USER $remote_user;
    fastcgi_param PATH_INFO $fastcgi_path_info;
    fastcgi_param SCRIPT_FILENAME $request_filename;
    fastcgi_param HTTP_AUTHORIZATION $http_authorization;
}

location ^~ <ALIAS>/data/ { deny all; }
location ^~ <ALIAS>/src/ { deny all; }
location = <ALIAS>/config.php { deny all; }
location = <ALIAS>/config.example.php { deny all; }
location = <ALIAS>/cron.php { deny all; }
location ~ ^<ALIAS>/.*\.(md|conf|gitignore)$ { deny all; }
